[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xva-ai-platform"
version = "0.1.0"
description = "Governed data tools (MCP server) and daily landing jobs for the XVA desk Copilot workflow"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.20,<2",        # pin to the v1 line until v2 leaves pre-release
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
api = ["uvicorn>=0.30", "starlette>=0.40"]   # REST API (both already come with mcp)
auth = ["pyjwt[crypto]>=2.10"]         # JWT validation for the HTTP deployment (lists of issuers)
landing = ["openpyxl>=3.1"]            # reading the MFL workbook
sql = ["pyodbc>=5"]                    # stored procedures
duckdb = ["duckdb>=1.1"]               # optional store backend; SQLite (built into Python) is the default
dev = ["pytest>=8", "pyjwt[crypto]>=2.10", "openpyxl>=3.1"]

[project.scripts]
xva-mcp = "xva_mcp.server:main"
xva-api = "xva_mcp.rest:main"
xva-cli = "xva_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xva_mcp = ["dictionary.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Keep pytest's scratch files inside the project. Corporate Windows profiles often block the default
# %TEMP%\pytest-of-<user> folder ("PermissionError: [WinError 5] Access is denied").
addopts = "--basetemp=.pytest_tmp"
