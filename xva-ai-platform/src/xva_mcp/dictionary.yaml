# XVA data dictionary: the single source of definitions, units and conventions.
# The MCP server serves it through get_definition, and the skills tell the agent to use it.
# Replace the placeholder conventions below with the desk's agreed ones before go-live.

reporting_currency: CAD
sign_convention: "Values are adjustments to derivative fair value: negative = cost to the bank."

# XVA components stored per counterparty. in_total: true = the component adds into total XVA.
# A desk with other components (e.g. CVACO, DVACO) uses its own dictionary: see landing/desk_dictionary.yaml
# and the XVA_DICTIONARY_PATH setting.
measures:
  CVA:
    in_total: true
    definition: Credit valuation adjustment - expected loss from counterparty default on derivative exposure.
    unit: CAD
    additive_across: [netting_set, counterparty, book, desk]
  DVA:
    in_total: true
    definition: Debit valuation adjustment - value of the bank's own default on negative exposure.
    unit: CAD
    additive_across: [netting_set, counterparty, book, desk]
  FVA:
    in_total: true
    definition: Funding valuation adjustment - funding cost (FCA) net of funding benefit (FBA) on uncollateralised exposure.
    unit: CAD
    additive_across: [netting_set, counterparty, book, desk]
  TOTAL:
    definition: Total XVA = CVA + DVA + FVA as reported by the official XVA run.
    unit: CAD

# Which XVA component each sensitivity row is of; the first is the default for get_xva_sensitivities.
sensitivity_components: [XVA]

# Per asset class: measures in the store (the first is the default). Units come from here.
sensitivities:
  IR:
    delta: {unit: "CAD per bp", definition: "XVA change for a +1bp move in the zero curve bucket"}
    vega: {unit: "CAD per vol point", definition: "XVA change for +1 normal vol point in the swaption bucket"}
  FX:
    delta: {unit: "CAD per 1%", definition: "XVA change for a +1% move in the FX spot rate"}
  EQ:
    delta: {unit: "CAD per 1%", definition: "XVA change for a +1% move in the equity index level"}
  CO:
    delta: {unit: "CAD per 1%", definition: "XVA change for a +1% move in the commodity forward curve"}
  CR:
    cs01: {unit: "CAD per bp", definition: "XVA change for +1bp in the counterparty credit spread bucket"}

pnl_drivers:
  market_IR: Interest-rate moves (curves and vols)
  market_FX: FX spot and vol moves
  market_EQ: Equity moves
  market_CO: Commodity moves
  market_CR: Counterparty credit spread moves
  time_decay: Passage of time with markets unchanged (theta / roll-down)
  new_trades: XVA of trades booked since the prior run
  amendments: Changes to existing trades or CSA terms
  terminations: Trades matured, unwound or novated away
  model_or_parameter: Model, methodology or parameter changes
  unexplained: Residual not attributed to any driver above

# Sources that must load and pass their checks before a date counts as "clean". List only the sources you
# actually land, or every date will show them as missing.
expected_sources: [xva_system, mfl_spreadsheet, stored_procs]

# The source whose run is the official one for XVA values, sensitivities and P&L explain.
# The tools read the fact tables for this source's run on each date (see data_status).
official_source: xva_system

thresholds:
  unexplained_abs_cad: 250000        # flag if |unexplained| exceeds this per day at desk level
  unexplained_pct_of_change: 0.10    # or exceeds 10% of the XVA change
  mover_abs_cad: 100000              # counterparty day-on-day move worth a drill-down
